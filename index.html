<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="banner">
        <img src="img/employee-management-api-banner-2557x550.png" alt="">

        <h1 class="title">
            Employee<br>
            Management<br>
            System
        </h1>
    </div>

    <div>
        <h2>Add New Employee</h2>

        <form>

            <!-- first raw-->
            <div class="form-row">
                <div class="field">
                    <label for="empName">Employee Name</label>
                    <input type="text" placeholder="Full Name" id="empName" autocomplete="off">
                </div>


                <div class="field">
                    <label for="email">E-mail</label>
                    <input type="email" placeholder="Email Address" id="email" autocomplete="off">
                </div>

                <div class="field">
                    <label for="TP">Phone</label>
                    <input type="tel" placeholder="07" id="TP" autocomplete="off">
                </div>
            </div>

            <!-- second raw-->
            <div class="form-row">
                <div class="field">
                    <label for="gender">Gender</label>
                    <select name="" id="gender">
                        <option value="">Choose</option>
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Prefer not to say">Prefer not to say</option>
                    </select>
                </div>


                <div class="field">
                    <label for="DOJ">Date of joining</label>
                    <input type="date" placeholder="yyyy-mm-dd" id="DOJ">
                </div>


                <div class="field">
                    <label for="departments">Department</label>
                    <select name="" id="departments">
                        <option value="">Select Department</option>
                        <option value="Product & Engineering">Product & Engineering</option>
                        <option value="Sales & Marketing">Sales & Marketing</option>
                        <option value="Finance & Accounting">Finance & Accounting</option>
                        <option value="Operations & HR">Operations & HR</option>
                        <option value="Legal, Security & Compliance">Legal, Security & Compliance</option>
                    </select>
                </div>
            </div>

            <!-- third raw-->
            <div class="form-row">
                <div class="field">
                    <label for="designations">Designation</label>
                    <select id="designations">
                        <option value="">Select Designation</option>
                    </select>
                </div>


                <div class="field">
                    <label for="types">Employee Type</label>
                    <select name="" id="types">
                        <option value="">Select Type</option>
                        <option value="Trainee/Intern">Trainee/Intern</option>
                        <option value="Contract">Contract</option>
                        <option value="Part-Time">Part-Time</option>
                        <option value="Full-Time">Full-Time</option>
                    </select>
                </div>


                <div class="field">
                    <label for="salary">Monthly Salary</label>
                    <input type="number" id="salary" placeholder="Rs." autocomplete="off">
                </div>
            </div>

            <div style="text-align:center;">
                <button type="button" style="color: rgb(225, 225, 235); background-color: rgb(9, 9, 75);"
                    onclick="saveEmployee()">Save
                    Employee</button>
            </div>

            <div id="successBanner"></div>

        </form>

    </div>

    <h2>Employee Details</h2>

    <div class="table-container">
        <table border="2" width="100%" style="color: rgb(9, 9, 75); background-color: rgb(207, 223, 238);">
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Contact</th>
                    <th>Gender</th>
                    <th>Department</th>
                    <th>Designation</th>
                    <th>Type</th>
                    <th>Salary</th>
                    <th>Actions</th>
                </tr>
            </thead>

            <tbody id="employeeTableBody">

            </tbody>
        </table>
    </div>

    <script src="js/app.js"></script>
</body>

</html>
