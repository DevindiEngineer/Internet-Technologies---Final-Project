<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

    <div class="banner">
        <img src="img/employee-management-api-banner-2557x550.png" alt="">

        <h1 class="title">
            Employee<br>
            Management<br>
            System
        </h1>
    </div>

    <div>
        <h2>Add New Employee</h2>

        <form>

            <!-- first raw-->
            <div class="form-row">
                <div class="field">
                    <label for="">Employee Name</label>
                    <input type="text" placeholder="Full Name">
                </div>


                <div class="field">
                    <label for="">E-mail</label>
                    <input type="email" placeholder="Email Address">
                </div>

                <div class="field">
                    <label for="">Phone</label>
                    <input type="tel" placeholder="07">
                </div>
            </div>

            <!-- second raw-->
            <div class="form-row">
                <div class="field">
                    <label for="">Gender</label>
                    <select name="" id="">
                        <option value="">Choose</option>
                        <option value="">Male</option>
                        <option value="">Female</option>
                        <option value="">Prefer not to say</option>
                    </select>
                </div>


                <div class="field">
                    <label for="">Date of joining</label>
                    <input type="date" placeholder="yyyy-mm-dd">
                </div>


                <div class="field">
                    <label for="">Department</label>
                    <select name="" id="departments">
                        <option value="">Select Department</option>
                        <option value="ENG">Product & Engineering</option>
                        <option value="SM">Sales & Marketing</option>
                        <option value="ACC">Finance & Accounting</option>
                        <option value="HR">Operations & HR</option>
                        <option value="LGL">Legal, Security & Compliance</option>
                    </select>
                </div>
            </div>

            <!-- third raw-->
            <div class="form-row">
                <div class="field">
                    <label for="">Designation</label>
                    <select id="designations">
                        <option value="">Select Designation</option>
                    </select>
                </div>


                <div class="field">
                    <label for="">Employee Type</label>
                    <select name="" id="">
                        <option value="">Select Type</option>
                        <option value="ENG">Trainee/Intern</option>
                        <option value="ENG">Contract</option>
                        <option value="SM">Part-Time </option>
                        <option value="ACC">Full-Time</option>
                    </select>
                </div>


                <div class="field">
                    <label for="">Monthly Salary</label>
                    <input type="number" id="salary" placeholder="Rs.">
                </div>
            </div>

            <div style="text-align:center;">
                <button type="submit" style="color: rgb(225, 225, 235); background-color: rgb(9, 9, 75);">Save
                    Employee</button>
            </div>

        </form>

    </div>

    <script src="js/app.js"></script>
</body>

</html>
